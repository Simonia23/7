<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ნატურალური მსხალი</title>
  <!-- ეს უკავშირდება ჩვენი CSS ფაილს -->
  <link rel="stylesheet" href="styles.css" />
  <!-- Font Awesome ბიბლიოთეკა - აიქონებისთვის -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <!-- მთლიანი პროდუქტის ბარათის კონტეინერი -->
  <div class="card">

    <!-- ზემოთ მარჯვენა მხარეს აიქონები (გულის და გაზიარების) -->
    <div class="icons">
      <i class="fa-regular fa-heart"></i>
      <i class="fa-solid fa-share-nodes"></i>
    </div>

    <!--  პროდუქტის გამოსახულების კონტეინერი -->
    <div class="img-box">
      <img src="https://food.fnr.sndimg.com/content/dam/images/food/fullset/2012/11/27/0/HEW_Pears_s4x3.jpg.rend.hgtvcom.1280.960.85.suffix/1371612039080.webp" alt="Pear">
    </div>

    <!--  პროდუქტის დასახელება -->
    <h2 class="title">ნატურალური მსხალი</h2>

    <!--  აღწერა -->
    <p>მხოლოდ ჩვენთან:</p>

    <!--  ფასი -->
    <div class="price">2.99 ლარი / 1 kg</div>

    <!--  პროდუქტის უპირატესობების სექცია -->
    <div class="benefits">
      <div class="benefit">🍐 მსხალი მდიდარია ბოჭკოთი</div>
      <div class="benefit">🌿 კარგია საჭმლის მონელებისთვის</div>
      <div class="benefit">❤️ გულსისხლძარღვთა ჯანმრთელობა </div>
    </div>

    <!-- : ღილაკი პროდუქტის კალათაში დასამატებლად -->
    <button class="add-cart"> კალათაში დამატება </button>
  </div>
</body>
</html>
